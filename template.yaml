# AWS CloudFormation Template for a WhatsApp Webhook Application
# This template defines resources for an API Gateway HTTP API and AWS Lambda functions
# to handle WhatsApp webhook events, along with DynamoDB tables for data storage.

AWSTemplateFormatVersion: '2010-09-09'  # Specifies the version of the AWS CloudFormation template format.
Transform: AWS::Serverless-2016-10-31  # Enables the use of AWS SAM (Serverless Application Model).
Description: WhatsApp Webhook (API Gateway HTTP API + Lambda)  # Description of the template.

Globals:
  Function:
    Runtime: python3.12  # Specifies the Python runtime for all Lambda functions.
    Timeout: 10  # Maximum execution time for Lambda functions in seconds.
    MemorySize: 256  # Memory allocated to Lambda functions in MB.
    Tracing: Active  # Enables AWS X-Ray tracing for Lambda functions.
    Architectures: [ x86_64 ]  # Specifies the architecture for Lambda functions.
    Environment:
      Variables:  # Environment variables for Lambda functions.
        VERIFY_TOKEN: dev-bot-verify-token
        APP_SECRET: dev-bot-meta-api-key
        PHONE_ID: dev-bot-phone-number-id
        USER_TOKEN: dev-bot-system-user-token
        PRODUCTS_TABLE_NAME: !Ref ProductsTable  # Reference to the Products DynamoDB table.
        CARTS_TABLE_NAME: !Ref CartsTable  # Reference to the Carts DynamoDB table.
        ORDERS_TABLE_NAME: !Ref OrdersTable  # Reference to the Orders DynamoDB table.
        USERS_TABLE_NAME: !Ref UsersTable  # Reference to the Users DynamoDB table.

Resources:
  # DynamoDB Table to store product catalog data.
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ds-products  # Name of the DynamoDB table.
      BillingMode: PAY_PER_REQUEST  # On-demand billing mode.
      AttributeDefinitions:  # Attributes for the table.
        - AttributeName: productId
          AttributeType: S  # String type.
        - AttributeName: category
          AttributeType: S
        - AttributeName: sortKey
          AttributeType: S
      KeySchema:  # Primary key schema.
        - AttributeName: productId
          KeyType: HASH  # Partition key.
      GlobalSecondaryIndexes:  # Secondary index for querying by category.
        - IndexName: CategoryIndex
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: sortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL  # Includes all attributes in the index.

  # DynamoDB Table to store user carts.
  CartsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ds-carts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: cartId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: cartId
          KeyType: RANGE
      TimeToLiveSpecification:  # Enables automatic deletion of expired items.
        AttributeName: expiresAt  # Attribute for TTL (epoch seconds).
        Enabled: true

  # DynamoDB Table to store confirmed orders.
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ds-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      GlobalSecondaryIndexes:  # Secondary index for querying user orders.
        - IndexName: UserOrdersIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # DynamoDB Table to store user data and session state.
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ds-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # IAM Role for Lambda functions to access DynamoDB and other AWS services.
  BotExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub whatsapp-bot-execution-role-${AWS::StackName}  # Role name with stack name suffix.
      AssumeRolePolicyDocument:  # Trust policy for Lambda service.
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:  # AWS managed policies for Lambda execution and X-Ray.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:  # Inline policy for DynamoDB and SSM Parameter Store access.
        - PolicyName: BotDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permissions for DynamoDB operations.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt ProductsTable.Arn
                  - !GetAtt CartsTable.Arn
                  - !GetAtt OrdersTable.Arn
                  - !GetAtt UsersTable.Arn
              - Effect: Allow
                Action: dynamodb:Query
                Resource:
                  - !Sub "${OrdersTable.Arn}/index/UserOrdersIndex"
                  - !Sub "${ProductsTable.Arn}/index/CategoryIndex"
              # Permissions for SSM Parameter Store.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - arn:aws:ssm:ap-south-1:430118830579:parameter/dev-bot-meta-api-key
                  - arn:aws:ssm:ap-south-1:430118830579:parameter/dev-bot-verify-token
                  - arn:aws:ssm:ap-south-1:430118830579:parameter/dev-bot-system-user-token
                  - arn:aws:ssm:ap-south-1:430118830579:parameter/dev-bot-phone-number-id

  # Lambda function to handle incoming POST requests from WhatsApp.
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot  # Path to the function code.
      Handler: post_data.post_handler  # Entry point for the function.
      Role: !GetAtt BotExecutionRole.Arn  # IAM role for the function.

  # Lambda function to handle GET requests for webhook verification.
  VerifyBotFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: app.get_handler
      Role: !GetAtt BotExecutionRole.Arn

  # Lambda function to handle product-related operations.
  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: product_function.lambda_handler
      Role: !GetAtt BotExecutionRole.Arn

  # Lambda function to handle cart-related operations.
  CartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: cart_function.lambda_handler
      Role: !GetAtt BotExecutionRole.Arn

  # Lambda function to handle user-related operations.
  UserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: user_function.lambda_handler
      Role: !GetAtt BotExecutionRole.Arn

  # Lambda function to handle order-related operations.
  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: order_function.lambda_handler
      Role: !GetAtt BotExecutionRole.Arn