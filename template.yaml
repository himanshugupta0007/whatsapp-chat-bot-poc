# AWS CloudFormation Template for a WhatsApp Webhook Application
# Updated to add: SQS inbound/outbound + DLQs, BotSessions + BotMessageLogs tables,
# and event mappings for: HTTP API -> WebhookIngestor -> Inbound SQS -> Orchestrator -> Outbound SQS -> Sender (Meta Cloud API)

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WhatsApp Webhook (API Gateway HTTP API + Lambda + SQS + DynamoDB) - Meta Cloud API

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Architectures: [ x86_64 ]
    Environment:
      Variables:
        # You currently use these as env vars. Recommended: read from SSM at runtime,
        # but keeping as-is to match your template.
        VERIFY_TOKEN: dev-bot-verify-token
        APP_SECRET: dev-bot-meta-api-key
        PHONE_ID: dev-bot-phone-number-id
        USER_TOKEN: dev-bot-system-user-token

        PRODUCTS_TABLE_NAME: !Ref ProductsTable
        CARTS_TABLE_NAME: !Ref CartsTable
        ORDERS_TABLE_NAME: !Ref OrdersTable
        USERS_TABLE_NAME: !Ref UsersTable

        # NEW: bot flow infra
        BOT_SESSIONS_TABLE_NAME: !Ref BotSessionsTable
        BOT_MESSAGE_LOGS_TABLE_NAME: !Ref BotMessageLogsTable
        INBOUND_QUEUE_URL: !Ref InboundQueue
        OUTBOUND_QUEUE_URL: !Ref OutboundQueue

Resources:
  # =========================
  # DynamoDB Tables (Existing)
  # =========================
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ds-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
        - AttributeName: category
          AttributeType: S
        - AttributeName: sortKey
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CategoryIndex
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: sortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CartsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ds-carts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: cartId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: cartId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: CartIdIndex
          KeySchema:
            - AttributeName: cartId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ds-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: whatsappNumber
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserOrdersIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: WhatsAppOrdersIndex
          KeySchema:
            - AttributeName: whatsappNumber
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ds-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: PhoneIndex
          KeySchema:
            - AttributeName: phone
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # =========================
  # DynamoDB Tables (NEW)
  # =========================
  BotSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ds-bot-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: whatsappNumber
          AttributeType: S
      KeySchema:
        - AttributeName: whatsappNumber
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  BotMessageLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ds-bot-message-logs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: messageKey
          AttributeType: S
      KeySchema:
        - AttributeName: messageKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # =========================
  # SQS Queues (NEW)
  # =========================
  InboundDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ds-bot-inbound-dlq
      MessageRetentionPeriod: 1209600 # 14 days

  InboundQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ds-bot-inbound-queue
      VisibilityTimeout: 45
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt InboundDLQ.Arn
        maxReceiveCount: 3

  OutboundDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ds-bot-outbound-dlq
      MessageRetentionPeriod: 1209600 # 14 days

  OutboundQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ds-bot-outbound-queue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OutboundDLQ.Arn
        maxReceiveCount: 5

  # =========================
  # IAM Role (UPDATED)
  # =========================
  BotExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub whatsapp-bot-execution-role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: BotDynamoDBSqsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # DynamoDB access
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt ProductsTable.Arn
                  - !GetAtt CartsTable.Arn
                  - !GetAtt OrdersTable.Arn
                  - !GetAtt UsersTable.Arn
                  - !GetAtt BotSessionsTable.Arn
                  - !GetAtt BotMessageLogsTable.Arn

              - Effect: Allow
                Action: dynamodb:Query
                Resource:
                  - !Sub "${OrdersTable.Arn}/index/UserOrdersIndex"
                  - !Sub "${OrdersTable.Arn}/index/WhatsAppOrdersIndex"
                  - !Sub "${ProductsTable.Arn}/index/CategoryIndex"
                  - !Sub "${UsersTable.Arn}/index/PhoneIndex"
                  - !Sub "${CartsTable.Arn}/index/CartIdIndex"

              # SQS access (send + consume)
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:SendMessageBatch
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt InboundQueue.Arn
                  - !GetAtt OutboundQueue.Arn
                  - !GetAtt InboundDLQ.Arn
                  - !GetAtt OutboundDLQ.Arn

              # SSM parameters (keeping your explicit ARNs)
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - arn:aws:ssm:ap-south-1:430118830579:parameter/dev-bot-meta-api-key
                  - arn:aws:ssm:ap-south-1:430118830579:parameter/dev-bot-verify-token
                  - arn:aws:ssm:ap-south-1:430118830579:parameter/dev-bot-system-user-token
                  - arn:aws:ssm:ap-south-1:430118830579:parameter/dev-bot-phone-number-id

  # =========================
  # Lambda Functions (Existing + NEW flow)
  # =========================

  # 1) HTTP webhook -> push to InboundQueue (NEW)
  WebhookIngestorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: webhook_ingestor.handler   # <-- create this handler file
      Role: !GetAtt BotExecutionRole.Arn
      Timeout: 10

  # 2) Inbound SQS consumer -> decide response -> push to OutboundQueue (NEW)
  ConversationOrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: conversation_orchestrator.handler  # <-- create this handler file
      Role: !GetAtt BotExecutionRole.Arn
      Timeout: 30
      Events:
        InboundQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt InboundQueue.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # 3) Outbound SQS consumer -> send via Meta Cloud API (NEW)
  WhatsAppSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: whatsapp_sender.handler  # <-- create this handler file
      Role: !GetAtt BotExecutionRole.Arn
      Timeout: 30
      Events:
        OutboundQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt OutboundQueue.Arn
            BatchSize: 5
            MaximumBatchingWindowInSeconds: 2
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ---- Your existing Lambdas (kept as-is) ----
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: post_data.post_handler
      Role: !GetAtt BotExecutionRole.Arn

  VerifyBotFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: app.get_handler
      Role: !GetAtt BotExecutionRole.Arn

  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: product_function.lambda_handler
      Role: !GetAtt BotExecutionRole.Arn

  CartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: cart_function.lambda_handler
      Role: !GetAtt BotExecutionRole.Arn

  UserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: user_function.lambda_handler
      Role: !GetAtt BotExecutionRole.Arn

  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./whatsapp-bot
      Handler: order_function.lambda_handler
      Role: !GetAtt BotExecutionRole.Arn

Outputs:

  InboundQueueUrl:
    Value: !Ref InboundQueue

  OutboundQueueUrl:
    Value: !Ref OutboundQueue

  BotSessionsTableName:
    Value: !Ref BotSessionsTable

  BotMessageLogsTableName:
    Value: !Ref BotMessageLogsTable
